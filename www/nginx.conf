server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Canonical paths omit a trailing slash. Never construct a host from ingress headers.
  rewrite ^/(.+)/index\.html$ /$1 permanent;
  location = /index.html { return 301 /; }
  location / {
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /404.html;
  location = /404.html { internal; }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location = /sitemap.xml { expires 1h; }
  location = /robots.txt { expires 1h; }
  location /assets/ { try_files $uri =404; expires 1y; }
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
}
